[project]
name = "jumbo-worker"
version = "0.1.0"
description = "Project Jumbo Kaggle worker: tunnel bridge, blob transfer and job runtime"
requires-python = ">=3.10"
dependencies = [
  "blake3==1.0.11",
  "fastapi==0.146.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pynacl==1.6.2",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["datamodel-code-generator==0.83.0", "pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jumbo_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
