[package]
name = "jumbo-desktop"
version = "0.1.0"
description = "Jumbo desktop control center"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
futures-util = "0.3.34"
jumbo-bridge = { path = "../../../crates/jumbo-bridge" }
jumbo-contracts.workspace = true
jumbo-core.workspace = true
jumbo-ledger.workspace = true
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
serde.workspace = true
serde_json.workspace = true
# protocol-asset serves project files (panel images, narration) to the live preview.
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
time.workspace = true
tokio = { version = "1.53.2", features = ["sync", "time"] }

# Persistent Secret Service store (GNOME Keyring, KWallet) on Linux. Without a platform feature the
# crate silently uses an in-memory mock, so saved credentials were lost when the app closed.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.53.2", features = ["macros", "rt"] }

[lints]
workspace = true
