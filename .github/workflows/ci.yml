name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "worker[dev]"
      - run: python -m pytest -q
        working-directory: worker

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The bridge's end-to-end tests drive the real worker from this venv (they skip without it).
      - run: python -m venv worker/.venv && worker/.venv/bin/pip install -e "worker[dev]"
      - run: cargo fmt --all --check
      # The Tauri app needs WebKitGTK system packages on Linux; it is checked on Windows below.
      - run: cargo clippy --workspace --exclude jumbo-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude jumbo-desktop

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p jumbo-desktop -- -D warnings
